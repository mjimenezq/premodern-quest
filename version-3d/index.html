<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Magic The Beer Quest · Versión 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a22;color:#f9eed2;font:15px system-ui}header{padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font: bold 20px monospace;margin:0;color:#ffd06c}small{color:#b6c6c7}a{color:#ffd06c}button{background:#243c42;color:#fff4d5;border:1px solid #718581;border-radius:6px;padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffd06c}#stage{height:calc(100dvh - 180px);min-height:330px;position:relative;overflow:hidden;border-block:2px solid #ac8b49}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#tag{position:absolute;top:16px;left:20px;font: bold 20px monospace;text-shadow:2px 2px #102028;pointer-events:none}#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#102027dc;padding:9px 15px;border-radius:5px;max-width:90%;text-align:center;pointer-events:none}footer{padding:12px 20px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap}#pad{position:absolute;bottom:55px;left:15px;display:grid;grid-template-columns:repeat(3,44px);gap:3px}#pad button{padding:10px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#142e3cbb}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#talk{position:absolute;right:15px;bottom:58px;touch-action:none}dialog{background:#152935;color:#ffe4a3;border:2px solid #d4b16a;border-radius:8px;max-width:440px;line-height:1.6}dialog::backdrop{background:#0007}@media(max-width:600px){header{padding:10px}h1{font-size:15px}header small{font-size:11px}footer{padding:10px;font-size:12px}#stage{height:calc(100dvh - 195px)}#tag{font-size:16px}#hint{top:42px;bottom:auto;font-size:12px;width:90%;padding:6px}}
</style>
<header><div><h1>MAGIC THE BEER QUEST · 3D</h1><small>Prototipo separado · estética PS1 / Nintendo 64</small></div><a href="../" target="_blank" rel="noopener">Juego original ↗</a></header>
<main id="stage"><div id="tag">Cargando Curicó…</div><div id="hint">Preparando el mundo 3D</div><div id="pad"><button data-move="up" aria-label="Caminar adelante">▲</button><button data-move="left" aria-label="Caminar izquierda">◀</button><button data-move="down" aria-label="Caminar atrás">▼</button><button data-move="right" aria-label="Caminar derecha">▶</button></div><button id="talk">Hablar / Entrar</button></main>
<footer><div class="controls"><button id="camera">Cámara: ciudad</button><button id="rotate">Girar cámara</button><button id="light">Luz: día</button><button id="visit">Visitar tienda TCG</button></div><small>Flechas / WASD: caminar · E: hablar / entrar · C: cámara<br>Prueba visual: todavía sin combates ni guardados.</small></footer>
<dialog id="dialog"><p id="message"></p><button id="close">Continuar</button></dialog>
<script type="module" src="game.js"></script></html>
